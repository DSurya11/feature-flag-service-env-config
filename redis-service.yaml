# k8s/redis-service.yaml
#
# ClusterIP Service for Redis — internal only, not exposed outside the cluster.
#
# Why ClusterIP?
#   Redis is a backend dependency of the API, not a user-facing endpoint.
#   ClusterIP exposes it only inside the cluster, so only pods in the same
#   (or cross-namespace-permitted) cluster can reach it.
#
# DNS name this Service creates:
#   redis.feature-flag.svc.cluster.local:6379
#
# This is the value used in the REDIS_URL secret:
#   redis://redis.feature-flag.svc.cluster.local:6379
#
# The short form `redis:6379` also works from within the same namespace
# because kube-dns search domains include the local namespace.  The full
# FQDN is used in the secret to be explicit and portable.
#
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: feature-flag
  labels:
    app: redis
    app.kubernetes.io/part-of: feature-flag-service
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
