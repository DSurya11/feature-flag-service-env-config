# Required check on main (ruleset): everything Argo CD would apply must render and match the
# Kubernetes + CRD schemas, whether a human, a CI bot or Backstage wrote it (PLATFORM_REVIEW F2).
name: validate

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: validate-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install kubeconform (pinned + checksum)
        run: |
          curl -sSfL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar xzf kc.tgz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Render and validate
        run: ./scripts/validate.sh
