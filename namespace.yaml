# k8s/namespace.yaml
#
# Why a dedicated namespace rather than deploying into `default`?
#
#   - Namespaces are how real clusters isolate teams and services from each
#     other.  `default` is a catch-all with no access controls, no resource
#     quotas, and no clear ownership — fine for one-off experiments, wrong for
#     anything you'd call a service.
#   - Argo CD (next step) and Backstage (later) both operate in terms of
#     namespaces: Argo CD ApplicationSets are scoped to namespaces, Backstage
#     service discovery uses namespace labels.  Starting with an explicit
#     namespace avoids restructuring every manifest later.
#   - kubectl commands throughout this project always pass `-n feature-flag`
#     explicitly so it's clear which namespace every resource lives in.
#
apiVersion: v1
kind: Namespace
metadata:
  name: feature-flag
  labels:
    app.kubernetes.io/part-of: feature-flag-service
