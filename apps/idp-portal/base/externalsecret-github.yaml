# GitHub App "ff-idp-backstage" credentials for the catalog and the scaffolder.
# Source: ff-idp/backstage-github-app, loaded from ~/.ff-idp by `make up` each session.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: idp-portal-github
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: idp-portal-github
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef: {key: ff-idp/backstage-github-app, property: appId}
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef: {key: ff-idp/backstage-github-app, property: clientId}
    - secretKey: GITHUB_APP_CLIENT_SECRET
      remoteRef: {key: ff-idp/backstage-github-app, property: clientSecret}
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: {key: ff-idp/backstage-github-app, property: privateKey}
