# Golden path: the Step 28 zero-downtime settings, baked in for every new service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-svc
  labels:
    app: hello-svc
spec:
  # No replicas: the HPA owns the count.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello-svc
  template:
    metadata:
      labels:
        app: hello-svc
    spec:
      terminationGracePeriodSeconds: 40
      priorityClassName: business-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hello-svc
      containers:
        - name: app
          image: 693906847772.dkr.ecr.ap-south-1.amazonaws.com/svc/hello-svc:set-by-overlay
          ports:
            - containerPort: 8000
              name: http
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "20"]
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
