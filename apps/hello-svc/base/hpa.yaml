apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-svc
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # after the Deployment (Finding 41)
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-svc
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
