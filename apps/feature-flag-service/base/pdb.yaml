# Voluntary disruptions (node drain, node group upgrade) may never take the API to zero.
# Overlays raise this where there are more replicas (prod: 2 of min 3).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: feature-flag-api
  annotations:
    # Wave 3, after the Deployment (wave 2): a PDB with no matching pods may report unhealthy, which would block earlier waves.
    argocd.argoproj.io/sync-wave: "3"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: feature-flag-api
