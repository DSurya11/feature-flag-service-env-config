# =============================================================================
# Namespace: feature-flag-dev
#
# The app namespace for the feature-flag-service dev environment.
# Created here so ESO can sync ExternalSecrets into it before the app deploys.
#
# After Step 27: this file moves to apps/feature-flag-service/base/namespace.yaml
# The existing namespace.yaml in the repo root targets the old kind cluster
# (namespace: feature-flag). This one uses the EKS convention: feature-flag-dev.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: feature-flag-dev
  labels:
    app.kubernetes.io/part-of: feature-flag-service
    environment: dev
