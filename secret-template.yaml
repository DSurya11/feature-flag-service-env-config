# k8s/secret-template.yaml
#
# REFERENCE TEMPLATE ONLY — DO NOT COMMIT REAL VALUES.
#
# This file documents the shape of the two secrets this service needs.
# It is committed with placeholder values so the repo is self-documenting.
# The real secrets are applied imperatively via `kubectl create secret` and
# never stored in Git (see .gitignore for the patterns that prevent accidents).
#
# ============================================================================
# Secret 1: feature-flag-secrets  (app credentials)
# ============================================================================
#
# Apply with:
#
#   kubectl create secret generic feature-flag-secrets \
#     --namespace feature-flag \
#     --from-literal=DATABASE_URL='postgresql://<user>:<pass>@<neon-host>/<db>?sslmode=require&channel_binding=require' \
#     --from-literal=REDIS_URL='redis://redis.feature-flag.svc.cluster.local:6379' \
#     --from-literal=JWT_SECRET_KEY='<your-hex-secret>'
#
# REDIS_URL note: the value above is intentionally the in-cluster Service DNS
# name, NOT `redis://redis:6379` (that was docker-compose-network-specific) and
# NOT `redis://localhost:6379` (that was host-machine-specific).
# Kubernetes Service DNS pattern: <service-name>.<namespace>.svc.cluster.local
# The Redis Service is named `redis` in namespace `feature-flag`, so the
# correct in-cluster address is `redis.feature-flag.svc.cluster.local:6379`.
#
# ============================================================================
# Secret 2: ghcr-pull-secret  (GHCR image pull credentials)
# ============================================================================
#
# Apply with:
#
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --namespace feature-flag \
#     --docker-server=ghcr.io \
#     --docker-username=DSurya11 \
#     --docker-password=<GitHub-PAT-with-read:packages-scope-only> \
#     --docker-email=any@email.com
#
# Why: GHCR packages linked to a private repo are private by default.
# The kind cluster has no ambient GitHub credentials, so without this secret
# every API pod would fail with ImagePullBackOff.  Using imagePullSecrets in
# the Deployment references this secret to authenticate the pull.
# Minimum-privilege note: the PAT should have ONLY `read:packages` scope.
# No `write:packages`, no `repo` access, nothing broader.
#
# ============================================================================
# Secrets strategy note for interviews
# ============================================================================
#
# Secrets are currently applied manually (imperatively) because this project
# does not yet have Sealed Secrets or External Secrets Operator (ESO) — both
# are explicitly listed as stretch goals.  The imperative approach means:
#   - The cluster holds the real values; Git holds only this placeholder file.
#   - A new contributor must obtain values out-of-band and apply them manually.
# ESO or Sealed Secrets would replace step 2 entirely: secrets live in a
# secrets manager (Vault, AWS Secrets Manager, etc.) and the operator syncs
# them into the cluster automatically.  That's the production-correct pattern;
# this is the honest simplification for a portfolio project.
#
---
# Shape reference for feature-flag-secrets (never apply this directly)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: feature-flag-secrets
#   namespace: feature-flag
# type: Opaque
# stringData:
#   DATABASE_URL: "<REPLACE_ME — Neon connection string>"
#   REDIS_URL: "<REPLACE_ME — must be redis://redis.feature-flag.svc.cluster.local:6379>"
#   JWT_SECRET_KEY: "<REPLACE_ME — 64-char hex secret>"
